<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advocate.NOW | Hearing Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
         url("/static/assets/img/bg/calender.jpg");
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
    position: relative;
}

/* Brand Header */
.brand-header {
    position: absolute;
    top: 26px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
}

.brand-bar {
    width: 4px;
    height: 38px;
    background: #c9a24d;
    border-radius: 2px;
}

.brand-text {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.6px;
}

/* Glass Card */
.card {
    position: relative;
    width: 420px;
    padding: 40px 30px;
    background: rgba(20,20,20,0.88);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.85);
    color: #fff;
}

/* Home Icon */
.home-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    transition: color 0.25s ease, transform 0.2s ease;
}

.home-icon:hover {
    color: #e0c27a;
    transform: translateY(-1px);
}

/* Card Header */
.card h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 30px;
    font-family: "Times New Roman", serif;
    font-size: 26px;
    letter-spacing: 0.5px;
}

/* Form */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #e0c27a;
}

input, textarea {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    outline: none;
}

textarea {
    resize: none;
}

input:focus, textarea:focus {
    border-color: #c9a24d;
}

/* Icons inside inputs */
.input-icon {
    position: relative;
}

.input-icon input, .input-icon textarea {
    padding-left: 36px;
}

.input-icon::before {
    content: attr(data-icon);
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #e0c27a;
}

/* Submit Button */
.btn {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #c9a24d, #8b6a3e);
    color: #111;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.25s ease;
}

.btn:hover {
    filter: brightness(1.06);
}

/* Responsive */
@media (max-width: 480px) {
    .card { width: 90%; padding: 30px 20px; }
}
</style>
</head>
<body>

<div class="brand-header">
    <div class="brand-bar"></div>
    <div class="brand-text">Advocate.NOW</div>
</div>

<div class="card">

<a href="/manage_appointment_and_fee/view_ap/" class="home-icon" title="Home">⌂</a>

    <h2>Hearing Details</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="input-icon" data-icon="📅">
            <label>Hearing Date</label>
            <input type="date" name="hearing_date_time" required>
        </div>

        <div class="input-icon" data-icon="🏛️">
            <label>Court Name</label>
            <input type="text" name="court_name" placeholder="Enter court name" required>
        </div>

        <div class="input-icon" data-icon="📍">
            <label>Court Address</label>
            <textarea name="court_address" rows="3" placeholder="Enter court address" required></textarea>
        </div>

        <button type="submit" class="btn">Submit</button>
    </form>
</div>

</body>
</html>
