<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advocate.NOW | View Police Stations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url("https://images.unsplash.com/photo-1581092334435-1b6c9e6d0c7f?auto=format&fit=crop&w=1920&q=80");
    background-size: cover;
    background-position: center;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

/* Brand Header */
.brand-header {
    position: absolute;
    top: 26px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
}

.brand-bar { width: 4px; height: 38px; background: #c9a24d; border-radius: 2px; }
.brand-text { font-size: 30px; font-weight: 800; letter-spacing: 0.6px; }

/* Glass Card */
.card-wrapper {
    width: 95%;
    max-width: 1000px;
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.85);
    background: rgba(20,20,20,0.88);
    padding: 40px 30px;
    position: relative;
}

/* Home Icon */
.home-icon {
    position: absolute;
    top: 28px;
    right: 28px;
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    transition: color 0.25s ease, transform 0.2s ease;
}

.home-icon:hover { color: #e0c27a; transform: translateY(-1px); }

/* Card Header */
.card-wrapper h2 {
    text-align: center;
    margin-bottom: 30px;
    font-family: "Times New Roman", serif;
    font-size: 26px;
    letter-spacing: 0.5px;
}

.card-wrapper table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.card-wrapper th, .card-wrapper td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    vertical-align: top;
    color: #fff;
}

.card-wrapper th {
    font-weight: 600;
    background: rgba(201,162,77,0.25);
}

.card-wrapper tbody tr:hover {
    background: rgba(201,162,77,0.1);
}

/* Responsive */
@media (max-width: 768px) {
    .card-wrapper { padding: 30px 20px; }
    th, td { font-size: 12px; padding: 8px; }
}
</style>
</head>
<body>

<div class="brand-header">
    <div class="brand-bar"></div>
    <div class="brand-text">Advocate.NOW</div>
</div>

<div class="card-wrapper">
    <a href="/" class="home-icon" title="Home">⌂</a>

    <h2>Police Station Details</h2>

    <table>
        <thead>
            <tr>
                <th>NBPS ID</th>
                <th>Place</th>
                <th>Phone Number</th>
                <th>Pin Code</th>
            </tr>
        </thead>
        <tbody>
            {% for i in yy %}
            <tr>
                <td>{{ i.near_by_ps_id }}</td>
                <td>{{ i.place }}</td>
                <td>{{ i.phone_number }}</td>
                <td>{{ i.pincode }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" style="text-align:center; padding:20px; color:rgba(255,255,255,0.7);">
                    No police stations found
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
