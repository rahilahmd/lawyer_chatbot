<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advocate.NOW | Find Nearby Police Station</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.50)),
        url("/static/assets/img/bg/police.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 120px;
}

.brand-header {
    position: absolute;
    top: 26px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-bar { width: 4px; height: 38px; background: #c9a24d; }
.brand-text { font-size: 30px; font-weight: 800; }

.home-icon {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 20px;
    text-decoration: none;
    color: rgba(255,255,255,0.8);
    transition: color 0.25s ease, transform 0.2s ease;
}

.home-icon:hover {
    color: #e0c27a;
    transform: translateY(-2px);
}

.card {
    width: 480px;
    padding: 40px 30px;
    background: rgba(20,20,20,0.88);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.85);
}

.card h2 {
    text-align: center;
    margin-bottom: 20px;
    font-family: "Times New Roman", serif;
}

.map-box {
    width: 100%;
    height: 220px;
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 2px solid rgba(30,144,255,0.4);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

label {
    font-weight: 600;
    color: #1e90ff;
    margin-bottom: 6px;
    display: block;
}

input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: #fff;
}

input::placeholder { color: rgba(255,255,255,0.7); }

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #1e90ff, #104e8b);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
}

.btn.secondary {
    background: linear-gradient(135deg, #555, #333);
}

@media (max-width: 480px) {
    .card { width: 90%; }
}
</style>
</head>

<body>

<div class="brand-header">
    <div class="brand-bar"></div>
    <div class="brand-text">Advocate.NOW</div>
</div>

<a href="/temp/users/" class="home-icon" title="Home">⌂</a>

<div class="card">
    <h2>🛡️ Find Nearby Police Station</h2>

    <!-- Map -->
    <div class="map-box">
        <iframe id="map"
            src="https://maps.google.com/maps?q=police%20station&z=13&output=embed">
        </iframe>
    </div>

    <!-- Search -->
    <label>Enter Place or Area</label>
    <input type="text" id="place" placeholder="Eg: kozhikode,kerala">

    <button class="btn" onclick="searchPolice()">🔍 Find Police Stations</button>
    <button class="btn secondary" onclick="useLocation()">📍 Use My Current Location</button>
</div>

<script>
// 🔍 Open Google Maps for typed place
function searchPolice() {
    const place = document.getElementById("place").value;
    if (!place) {
        alert("Please enter a place");
        return;
    }

    // Open Google Maps in a new tab for nearby police stations
    const url = `https://www.google.com/maps/search/police+station+near+${encodeURIComponent(place)}`;
    window.open(url, "_blank");
}

// 📍 Use current location button (still updates iframe map)
function useLocation() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        // Reverse geocode to get location name
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
            .then(response => response.json())
            .then(data => {
                const locationName = data && data.display_name ? data.display_name : `${lat},${lon}`;
                document.getElementById("place").value = locationName;
                // Optionally update iframe map
                document.getElementById("map").src =
                    `https://maps.google.com/maps?q=police+station+near+${encodeURIComponent(locationName)}&z=15&output=embed`;
            })
            .catch(() => {
                document.getElementById("map").src =
                    `https://maps.google.com/maps?q=police+station+near+${lat},${lon}&z=15&output=embed`;
            });

    }, () => {
        alert("Location access denied");
    });
}
</script>
</body>
</html>
