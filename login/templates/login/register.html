<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advocate.NOW | Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --void: #050a14;
    --cyan: #4de3ff;
    --gold: #e3b95b;
    --text: #e8eef7;
    --muted: #8fa1b8;
    --line: rgba(120,160,210,0.22);
    --error: #ff7b7b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    font-family: "Sora", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(900px 500px at 15% 10%, rgba(77,227,255,0.14), transparent 60%),
        radial-gradient(800px 500px at 90% 90%, rgba(227,185,91,0.12), transparent 60%),
        var(--void);
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    align-items: center;
    overflow-x: hidden;
    position: relative;
}

/* ===== Moving grid floor ===== */
.floor {
    position: fixed;
    left: -25%; right: -25%; bottom: 0;
    height: 48vh;
    background:
        repeating-linear-gradient(90deg, rgba(77,227,255,0.22) 0 1px, transparent 1px 70px),
        repeating-linear-gradient(0deg, rgba(77,227,255,0.22) 0 1px, transparent 1px 70px);
    transform: perspective(420px) rotateX(62deg);
    transform-origin: bottom;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
            mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    animation: flow 4s linear infinite;
    pointer-events: none;
}
@keyframes flow { to { background-position: 0 70px, 0 70px; } }

/* ===== Drifting legal symbols ===== */
.glyphs span {
    position: fixed;
    bottom: -40px;
    font-family: "Fraunces", Georgia, serif;
    font-size: 28px;
    color: var(--gold);
    opacity: 0;
    animation: drift 14s linear infinite;
    pointer-events: none;
}
.glyphs span:nth-child(1) { left: 6%;  animation-delay: 0s; }
.glyphs span:nth-child(2) { left: 22%; animation-delay: 3s;  color: var(--cyan); }
.glyphs span:nth-child(3) { left: 46%; animation-delay: 6s; }
.glyphs span:nth-child(4) { left: 63%; animation-delay: 9s;  color: var(--cyan); }
.glyphs span:nth-child(5) { left: 81%; animation-delay: 2s; }
.glyphs span:nth-child(6) { left: 93%; animation-delay: 7s;  color: var(--cyan); }
@keyframes drift {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    15%  { opacity: .35; }
    85%  { opacity: .25; }
    100% { transform: translateY(-105vh) rotate(25deg); opacity: 0; }
}

/* ===== Hero (left) ===== */
.hero {
    grid-column: 1;
    grid-row: 1;
    position: relative;
    z-index: 1;
    padding: 48px 64px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
}

.logo {
    font-family: "Fraunces", Georgia, serif;
    font-size: 26px;
    color: #fff;
    text-decoration: none;
    margin-bottom: 8px;
}
.logo span { color: var(--gold); }

.scales { width: min(360px, 80%); height: auto; overflow: visible; }

.hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(32px, 3.6vw, 50px);
    line-height: 1.1;
    margin-top: 12px;
}
.hero h1 .line { display: block; overflow: hidden; }
.hero h1 .line > span { display: block; animation: reveal .9s cubic-bezier(.2,.8,.2,1) both; }
.hero h1 .line:nth-child(2) > span { animation-delay: .15s; color: var(--cyan); }

.hero p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 40ch;
    margin-top: 10px;
    animation: fadein 1s .5s both;
}

@keyframes reveal { from { transform: translateY(110%); } to { transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ===== Scales of justice animation ===== */
.scales .draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 1.6s ease-out forwards; }
.scales .beam { transform-origin: 160px 62px; animation: sway 6s ease-in-out 1.4s infinite; }
.scales .pan  { animation: unsway 6s ease-in-out 1.4s infinite; }
.scales .pan.l { transform-origin: 40px 62px; }
.scales .pan.r { transform-origin: 280px 62px; }
.scales .pulse { animation: glow 3s ease-in-out infinite; }

@keyframes draw  { to { stroke-dashoffset: 0; } }
@keyframes sway   { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@keyframes unsway { 0%,100% { transform: rotate(7deg); }  50% { transform: rotate(-7deg); } }
@keyframes glow   { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

/* ===== Form card (right) ===== */
.panel {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 48px 32px;
}

.home-btn {
    position: fixed;
    top: 26px; right: 32px;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 2px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
}
.home-btn svg { width: 16px; height: 16px; stroke: currentColor; }
.home-btn:hover { color: var(--text); border-bottom-color: var(--gold); text-decoration: none; }

.login-card {
    width: 100%;
    max-width: 400px;
    padding: 38px 34px;
    border-radius: 20px;
    border: 1px solid transparent;
    background:
        linear-gradient(rgba(10,17,33,0.82), rgba(10,17,33,0.82)) padding-box,
        linear-gradient(135deg, rgba(77,227,255,0.65), rgba(255,255,255,0.08) 45%, rgba(227,185,91,0.65)) border-box;
    backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    animation: rise .8s .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

.login-card h2 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 6px;
}
.sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

.alert {
    background: rgba(255,123,123,0.1);
    color: var(--error);
    border: 1px solid rgba(255,123,123,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
}

label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; color: #c7d3e3; }

.field { position: relative; margin-bottom: 18px; }

input[type="text"], input[type="password"] {
    width: 100%;
    padding: 13px 15px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color .2s, box-shadow .2s, background .2s;
}
input::placeholder { color: #667891; }
input:focus {
    outline: none;
    border-color: var(--cyan);
    background: rgba(77,227,255,0.06);
    box-shadow: 0 0 0 4px rgba(77,227,255,0.14), 0 0 24px rgba(77,227,255,0.18);
}
#password { padding-right: 68px; }

.toggle {
    position: absolute;
    right: 8px; bottom: 7px;
    padding: 6px 10px;
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--cyan);
    background: none; border: none; border-radius: 6px;
    cursor: pointer;
}
.toggle:hover { background: rgba(77,227,255,0.1); }

.forgot { text-align: right; font-size: 12px; margin: -4px 0 24px; }

a { color: var(--gold); font-weight: 500; text-decoration: none; }
a:hover { text-decoration: underline; }

.btn {
    position: relative;
    width: 100%;
    padding: 14px;
    font: inherit; font-size: 15px; font-weight: 600;
    color: #1a1300;
    background: linear-gradient(135deg, var(--gold), #f3d58b 50%, var(--gold));
    background-size: 200% 100%;
    border: none; border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow .25s, transform .1s;
}
.btn:hover { box-shadow: 0 0 28px rgba(227,185,91,0.5); background-position: 100% 0; }
.btn:active { transform: translateY(1px); }

a:focus-visible, .role:focus-visible, .home-btn:focus-visible {
    outline: 3px solid var(--cyan);
    outline-offset: 2px;
}

.footer-text { margin-top: 24px; text-align: center; font-size: 13px; color: var(--muted); }

/* ===== Role choices ===== */
.role {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 18px;
    margin-bottom: 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    text-decoration: none;
    transition: border-color .2s, background .2s, transform .15s;
}
.role:last-of-type { margin-bottom: 0; }
.role:hover { text-decoration: none; transform: translateX(3px); }
.role.lawyer:hover { border-color: var(--gold); background: rgba(227,185,91,0.08); }
.role.user:hover   { border-color: var(--cyan); background: rgba(77,227,255,0.08); }

.role .ico {
    flex: none;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 12px;
}
.role.lawyer .ico { background: rgba(227,185,91,0.14); color: var(--gold); }
.role.user .ico   { background: rgba(77,227,255,0.12); color: var(--cyan); }
.role .ico svg { width: 24px; height: 24px; }

.role .txt { flex: 1; }
.role strong { display: block; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
.role small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; line-height: 1.4; }

.role .go { flex: none; width: 18px; height: 18px; stroke: var(--muted); transition: stroke .2s, transform .2s; }
.role:hover .go { transform: translateX(3px); }
.role.lawyer:hover .go { stroke: var(--gold); }
.role.user:hover .go   { stroke: var(--cyan); }

/* ===== Responsive ===== */
@media (max-width: 760px) {
    body { grid-template-columns: 1fr; align-items: start; }
    .hero, .panel { grid-column: 1; grid-row: auto; }
    .home-btn { top: 18px; right: 20px; }
    .hero { padding: 28px 24px 0; align-items: center; text-align: center; }
    .scales { width: 150px; }
    .hero h1, .hero p { display: none; }
    .panel { padding: 16px 20px 40px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .scales .draw { stroke-dashoffset: 0; }
    .glyphs { display: none; }
}
</style>
</head>

<body>

<div class="floor" aria-hidden="true"></div>
<div class="glyphs" aria-hidden="true"><span>&sect;</span><span>&para;</span><span>&sect;</span><span>&para;</span><span>&sect;</span><span>&para;</span></div>

<a href="/temp/home/" class="home-btn" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
    Home
</a>

<section class="hero">
    <a href="/temp/home/" class="logo">Advocate<span>.</span>NOW</a>

    <svg class="scales" viewBox="0 0 320 300" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g stroke="#e3b95b" stroke-width="3">
            <path class="draw" d="M120 285h80M135 285v-12h50v12M160 273V62"/>
            <g class="beam">
                <path class="draw" d="M40 62h240"/>
                <g class="pan l">
                    <path stroke="#4de3ff" stroke-width="1.5" d="M40 62L8 170M40 62L72 170"/>
                    <path class="pulse" stroke="#4de3ff" d="M2 170h76c0 26-17 38-38 38S2 196 2 170z" fill="rgba(77,227,255,0.12)"/>
                </g>
                <g class="pan r">
                    <path stroke="#4de3ff" stroke-width="1.5" d="M280 62l-32 108M280 62l32 108"/>
                    <path class="pulse" stroke="#4de3ff" d="M242 170h76c0 26-17 38-38 38s-38-12-38-38z" fill="rgba(77,227,255,0.12)"/>
                </g>
            </g>
            <circle cx="160" cy="48" r="11" fill="#050a14"/>
            <circle cx="160" cy="62" r="4" fill="#e3b95b"/>
        </g>
    </svg>

    <h1>
        <span class="line"><span>Two roles,</span></span>
        <span class="line"><span>one platform.</span></span>
    </h1>
    <p>Lawyers manage their practice and appointments. Users file complaints and find the right counsel.</p>
</section>

<main class="panel">
    <div class="login-card">
        <h2>Register as</h2>
        <p class="sub">Select your role to continue.</p>

       <a href="/register_lawyer/register/" Register Lawyer class="role lawyer">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0L5 7zM19 7l-3 7a3.5 3.5 0 0 0 6 0l-3-7z"/></svg>
            </span>
            <span class="txt"><strong>Lawyer</strong><small>Manage cases, hearings and appointments</small></span>
            <svg class="go" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a href="/user_register/register/" class="role user">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span class="txt"><strong>User</strong><small>File complaints and book a lawyer</small></span>
            <svg class="go" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
    </div>
</main>

</body>
</html>
